apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: webservice-issuer
  namespace: istio-ingress
spec:
  dnsNames:
  - auth.gitkb.localhost
  secretName: webservice-issuer
  issuerRef:
    name: webservice-local-ca
    kind: ClusterIssuer
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: webservice-issuer
  namespace: istio-ingress
spec:
  gatewayClassName: istio
  addresses:
  - type: Hostname
    value: webservice-private-istio.istio-ingress.svc.cluster.local
  listeners:
  - name: https
    port: 443
    protocol: HTTPS
    hostname: auth.gitkb.localhost
    tls:
      mode: Terminate
      certificateRefs:
      - name: webservice-issuer
    allowedRoutes:
      namespaces:
        from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: webservice-issuer
  namespace: istio-ingress
spec:
  parentRefs:
  - name: webservice-issuer
  hostnames:
  - auth.gitkb.localhost
  rules:
  - backendRefs:
    - name: zitadel
      namespace: auth
      port: 8080
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: webservice-issuer
  namespace: auth
spec:
  from:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    namespace: istio-ingress
  to:
  - group: ''
    kind: Service
    name: zitadel

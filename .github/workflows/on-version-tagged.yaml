name: promote
on:
  push:
    tags:
    - v*.*.*

permissions:
  packages: write
  contents: write
  issues: write
  pull-requests: write

jobs:

  publish:
    uses: hops-ops/workflows-crossplane/.github/workflows/publish.yaml@v3.2.0
    with:
      tag: ${{ github.ref_name }}

  release:
    needs: publish
    uses: unbounded-tech/workflow-simple-release/.github/workflows/workflow.yaml@v2.1.3
    with:
      tag: ${{ github.ref_name }}
      name: ${{ github.ref_name }}

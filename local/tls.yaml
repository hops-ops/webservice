apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: webservice-selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: webservice-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: WebService local test CA
  secretName: webservice-ca
  issuerRef:
    name: webservice-selfsigned
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: webservice-local-ca
spec:
  ca:
    secretName: webservice-ca
